  <h1>私隱政策</h1>
  <p>香港扭卡遊戲不會要求一般玩家提供姓名、電話或電郵。遊戲會在你的瀏覽器本機儲存分數及卡簿資料，讓你下次開啟時繼續查看；這些本機資料不會自動傳送給我們。</p>
  <p>管理後台使用 Google 登入驗證，只限指定管理員帳戶。系統只會使用登入帳戶的基本身份資料以確認管理權限。</p>
  <p>如有私隱問題，請聯絡 <a href="mailto:info@rgb-workshop.com">info@rgb-workshop.com</a>。</p>
