<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>香港扭卡機｜管理後台</title><link rel="stylesheet" href="admin.css"></head><body><main class="shell"><header><div><small>HONG KONG CARD GACHA CMS</small><h1>扭卡遊戲管理後台</h1></div><button id="logout" class="ghost" hidden>登出</button></header><section id="login" class="login"><h2>管理員登入</h2><p>只有指定的 Google Workspace 帳戶可以登入及發佈。</p><button id="loginButton">使用 Google 登入</button><p id="loginMessage"></p></section><form id="editor" hidden><div class="toolbar"><span id="userEmail"></span><div><button id="reload" type="button" class="ghost">重新載入</button><button type="submit">發佈設定</button></div></div><section><h2>卡機及分數</h2><div class="grid"><label>卡機封面圖片 URL<input id="coverUrl" required></label><label>試玩起始分數<input id="startingCredits" type="number" min="0" required></label><label>每次抽卡分數<input id="drawCost" type="number" min="0" required></label></div></section><section><h2>前台文字</h2><div id="textFields" class="grid"></div></section><section><div class="head"><div><h2>卡片款式</h2><p>圖片必須是直向2:3；權重越高越容易抽中。</p></div><button id="addCard" type="button">＋ 增加卡片</button></div><div id="cards"></div></section><div class="publish"><span id="message"></span><button type="submit">發佈全部修改</button></div></form></main><script type="module" src="admin.js"></script></body></html>
